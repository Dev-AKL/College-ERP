<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to the College ERP</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f4f4f4;
      }
      .welcome-container {
        text-align: center;
      }
      h1 {
        font-size: 2.5em;
        color: #333;
      }
      .btn-container {
        margin-top: 20px;
      }
      .btn {
        padding: 10px 20px;
        font-size: 1.2em;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        margin: 0 10px;
      }
      .btn-login {
        background-color: #007bff;
        color: white;
      }
      .btn-signup {
        background-color: #28a745;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="welcome-container">
      <h1>Welcome to the College ERP</h1>
      <p>Please log in or sign up to continue.</p>
      <div class="btn-container">
        <button
          class="btn btn-login"
          onclick="window.location.href='./login.html'"
        >
          Login
        </button>
        <button
          class="btn btn-signup"
          onclick="window.location.href='./signup.html'"
        >
          Sign Up
        </button>
      </div>
    </div>
  </body>
</html>
